name: ESP-IDF Build

on: [push, pull_request] 
 
jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo 
      uses: actions/checkout@v4 
      with: 
        submodules: 'recursi ve'
    - name: esp-idf build 
      uses: espressoff/esp-idf-ci-action@v1 
      with: 
        esp_idf_version: v5.1 
        target: es3c28p 
        
    - name: Upload Binaries 
      uses: actions/upload-artifact@v4 
      with: 
        name: esp32s3-binaries 
        path: build/metosfw.bin